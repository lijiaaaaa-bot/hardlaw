name: Hardlaw
options:
  bundleIdPrefix: com.hardlaw
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "16.0"

packages:
  mlx-swift-lm:
    url: https://github.com/ml-explore/mlx-swift-lm
    branch: main
  swift-huggingface:
    url: https://github.com/huggingface/swift-huggingface
    branch: main
  swift-transformers:
    url: https://github.com/huggingface/swift-transformers
    from: "1.1.6"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  HardlawKit:
    type: framework
    platform: iOS
    sources:
      - path: HardlawKit/Sources
      - path: HardlawKit/Vision
    resources:
      - path: HardlawKit/Resources/ClassifierRules
    dependencies:
      - package: mlx-swift-lm
        product: MLXLLM
      - package: mlx-swift-lm
        product: MLXLMCommon
      - package: mlx-swift-lm
        product: MLXHuggingFace
      - package: swift-huggingface
        product: HuggingFace
      - package: swift-transformers
        product: Tokenizers
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.hardlaw.kit
        DEVELOPMENT_TEAM: SP272623JD
        OTHER_LDFLAGS: [-lz]

  HardlawKitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - HardlawKit/Tests
    dependencies:
      - target: HardlawKit
      - target: HardlawApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/HardlawApp.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/HardlawApp"
        BUNDLE_LOADER: "$(TEST_HOST)"
        OTHER_LDFLAGS: [-lz]

  HardlawApp:
    type: application
    platform: iOS
    sources:
      - HardlawApp
    dependencies:
      - target: HardlawKit
    settings:
      base:
        DEVELOPMENT_TEAM: SP272623JD
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_OBJC_BRIDGING_HEADER: HardlawApp/Services/PaddleOCR-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - $(PROJECT_DIR)/HardlawApp/PaddleOCR/include
        LIBRARY_SEARCH_PATHS:
          - $(PROJECT_DIR)/HardlawApp/PaddleOCR/lib
        "OTHER_LDFLAGS[sdk=iphoneos*]":
          - -lpaddle_api_light_bundled
          - -lc++
    resources:
      - path: HardlawApp/LegalKnowledge
        type: folder
      - path: HardlawApp/bge-small-zh-v1.5.mlpackage
        # Xcode compiles .mlpackage → .mlmodelc at build time;
        # CoreMLEmbeddingProvider loads "bge-small-zh-v1.5.mlmodelc" from the app bundle.
    info:
      path: HardlawApp/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

schemes:
  HardlawKit:
    build:
      targets:
        HardlawKit: all
    test:
      targets:
        - HardlawKitTests
  HardlawApp:
    build:
      targets:
        HardlawApp: all
