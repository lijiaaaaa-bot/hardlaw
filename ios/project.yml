name: Hardlaw
options:
  bundleIdPrefix: com.hardlaw
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "16.0"

# MLX packages — enable after installing Metal Toolchain:
#   xcodebuild -downloadComponent MetalToolchain
# packages:
#   mlx-swift-lm:
#     url: https://github.com/ml-explore/mlx-swift-lm
#     branch: main

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete

packages:
  mlx-libraries:
    url: https://github.com/mlx-community/mlx-libraries
    from: "1.0.0"
  swift-transformers:
    url: https://github.com/huggingface/swift-transformers
    from: "1.1.6"

targets:
  HardlawKit:
    type: framework
    platform: iOS
    sources:
      - path: HardlawKit/Sources
      - path: HardlawKit/Vision
      - path: HardlawKit/Vision/PaddleOCR
      - path: HardlawKit/Sources/LegalKnowledge
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.hardlaw.kit
        LIBRARY_SEARCH_PATHS:
          - $(PROJECT_DIR)/HardlawKit/Vision/PaddleOCR/lib
        HEADER_SEARCH_PATHS:
          - $(PROJECT_DIR)/HardlawKit/Vision/PaddleOCR/include
        OTHER_LDFLAGS:
          - -lpaddle_api_light_bundled
          - -lc++
    dependencies:
      - package: mlx-libraries
    resources:
      - path: HardlawKit/Resources/LegalKnowledge
        type: folder

  HardlawKitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - HardlawKit/Tests
    dependencies:
      - target: HardlawKit
      - target: HardlawApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/HardlawApp.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/HardlawApp"
        BUNDLE_LOADER: "$(TEST_HOST)"

  HardlawApp:
    type: application
    platform: iOS
    sources:
      - HardlawApp
    dependencies:
      - target: HardlawKit
    settings:
      base:
        DEVELOPMENT_TEAM: 9F3HMSMBR5
        SWIFT_OBJC_BRIDGING_HEADER: HardlawApp/Services/PaddleOCR-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - $(PROJECT_DIR)/HardlawKit/Vision/PaddleOCR/include
        LIBRARY_SEARCH_PATHS:
          - $(PROJECT_DIR)/HardlawKit/Vision/PaddleOCR/lib
        "OTHER_LDFLAGS[sdk=iphoneos*]":
          - -lpaddle_api_light_bundled
          - -lc++
    info:
      path: HardlawApp/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

schemes:
  HardlawKit:
    build:
      targets:
        HardlawKit: all
    test:
      targets:
        - HardlawKitTests
  HardlawApp:
    build:
      targets:
        HardlawApp: all
