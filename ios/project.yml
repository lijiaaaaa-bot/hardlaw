name: Hardlaw
options:
  bundleIdPrefix: com.hardlaw
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  HardlawKit:
    type: framework
    platform: iOS
    sources:
      - path: HardlawKit/Sources
      - path: HardlawKit/Vision
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.hardlaw.kit



  HardlawKitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - HardlawKit/Tests
    dependencies:
      - target: HardlawKit
      - target: HardlawApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/HardlawApp.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/HardlawApp"
        BUNDLE_LOADER: "$(TEST_HOST)"

  HardlawApp:
    type: application
    platform: iOS
    sources:
      - HardlawApp
    dependencies:
      - target: HardlawKit
    settings:
      base:
        DEVELOPMENT_TEAM: 9F3HMSMBR5
        SWIFT_OBJC_BRIDGING_HEADER: HardlawApp/Services/PaddleOCR-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - $(PROJECT_DIR)/HardlawKit/Vision/PaddleOCR/include
        LIBRARY_SEARCH_PATHS:
          - $(PROJECT_DIR)/HardlawKit/Vision/PaddleOCR/lib
        "OTHER_LDFLAGS[sdk=iphoneos*]":
          - -lpaddle_api_light_bundled
          - -lc++
    info:
      path: HardlawApp/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

schemes:
  HardlawKit:
    build:
      targets:
        HardlawKit: all
    test:
      targets:
        - HardlawKitTests
  HardlawApp:
    build:
      targets:
        HardlawApp: all
