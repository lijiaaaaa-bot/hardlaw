name: Hardlaw
options:
  bundleIdPrefix: com.hardlaw
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  HardlawKit:
    type: framework
    platform: iOS
    sources:
      - path: HardlawKit/Sources
      - path: HardlawKit/Vision
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.hardlaw.kit

  HardlawKitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - HardlawKit/Tests
    dependencies:
      - target: HardlawKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true

  HardlawApp:
    type: application
    platform: iOS
    sources:
      - HardlawApp
    dependencies:
      - target: HardlawKit
    info:
      path: HardlawApp/Info.plist
      properties:
        NSCameraUsageDescription: "Hardlaw uses the camera to audit content for policy compliance in real time. All processing is performed on-device."
        NSPhotoLibraryUsageDescription: "Hardlaw needs access to your photo library to audit images for policy compliance."
        UILaunchScreen: {}

schemes:
  HardlawKit:
    build:
      targets:
        HardlawKit: all
    test:
      targets:
        - HardlawKitTests
  HardlawApp:
    build:
      targets:
        HardlawApp: all
